# --- SonarQube Cloud project identity ---
sonar.projectKey=jbanerjeePWC_Assignment2-CSCN73030
sonar.organization=jbanerjeepwc

# --- Analysis scope ---
# SonarQube Cloud's new analysis scope analyzes the whole repository by default and ignores
# sonar.sources / sonar.tests / sonar.test.inclusions (the baseline scan warned about this).
# Scope is therefore controlled with exclusions:
#   - CI helper script, generated reports and build-wrapper output are not project code
#   - data files and Visual Studio project files are not analysed
sonar.exclusions=tools/**,sonar-coverage.xml,coverage-cobertura.xml,bw-output/**,**/x64/**,**/Debug/**,**/Release/**,**/*.txt,**/*.vcxproj,**/*.filters,**/*.slnx
# Test code is not counted when measuring coverage.
sonar.coverage.exclusions=PrettyPrintTest/**
sonar.sourceEncoding=UTF-8

# --- Coverage ---
# OpenCppCoverage writes Cobertura XML; tools/cobertura_to_sonar.py converts it to
# SonarQube's generic coverage format, which is imported through this property.
sonar.coverageReportPaths=sonar-coverage.xml

# The build-wrapper compilation database is passed on the command line by the workflow:
#   -Dsonar.cfamily.compile-commands=bw-output/compile_commands.json
