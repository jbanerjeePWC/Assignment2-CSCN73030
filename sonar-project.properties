# --- SonarQube Cloud project identity (copy the EXACT values from SonarQube Cloud) ---
# Project key: SonarQube Cloud > your project > Information
# Organization key: SonarQube Cloud > your organization > Account/Organization settings
sonar.projectKey=jbanerjeePWC_Assignment2-CSCN73030
sonar.organization=jbanerjeepwc

# --- Analysis scope ---
# Production code: the console app plus the PrettyPrint feature.
sonar.sources=source.cpp,PrettyPrint.cpp,PrettyPrint.h,StudentData.h,BuildConfig.h
# Test code: the Microsoft CppUnitTest project.
sonar.tests=PrettyPrintTest
sonar.test.inclusions=PrettyPrintTest/**
# Build output and data files are not analysed.
sonar.exclusions=**/x64/**,**/Debug/**,**/Release/**,**/*.txt,**/*.vcxproj,**/*.filters,**/*.slnx
sonar.sourceEncoding=UTF-8

# --- Coverage ---
# OpenCppCoverage writes Cobertura XML; tools/cobertura_to_sonar.py converts it to
# SonarQube's generic coverage format, which is imported through this property.
sonar.coverageReportPaths=sonar-coverage.xml

# The build-wrapper compilation database is passed on the command line by the workflow:
#   -Dsonar.cfamily.compile-commands=bw-output/compile_commands.json
